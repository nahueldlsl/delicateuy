<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"/>
<title>Type — Body</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 24px; background: var(--cream-50); }
  .meta { font-family: var(--font-body); font-size: 11px; color: var(--fg3); letter-spacing: 0.06em; text-transform: uppercase; font-weight: 700; margin: 0 0 4px; }
  .h3 { font-family: var(--font-body); font-weight: 700; font-size: 22px; color: var(--fg1); margin: 4px 0 12px; }
  .body { font-family: var(--font-body); font-size: 16px; line-height: 1.55; color: var(--fg2); margin: 0 0 12px; max-width: 520px; }
  .small { font-family: var(--font-body); font-size: 13px; color: var(--fg3); }
</style></head><body>
<div class="meta">H3 · Nunito 700 · 22px</div>
<div class="h3">Cookie NY · dulce de leche</div>
<div class="meta">Body · Nunito 400 · 16px / 1.55</div>
<p class="body">Cookie estilo NY rellena de dulce de leche que se desborda al partirla. Pesa 120g, alcanza para compartir (o no).</p>
<div class="meta">Caption · Nunito 400 · 13px</div>
<p class="small">Te la preparo para retirar el viernes 8.</p>
