<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"/>
<title>Logo & brand marks</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 20px; background: var(--cream-50); font-family: var(--font-body); display: flex; gap: 24px; align-items: center; justify-content: center; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .meta { font-size: 11px; color: var(--fg3); letter-spacing: 0.06em; text-transform: uppercase; font-weight: 700; }
  img.sticker { width: 130px; height: 130px; }
  img.mono { width: 200px; }
  .on-dark { background: var(--choc-900); padding: 14px 18px; border-radius: 14px; }
</style></head><body>
<div class="item"><img class="sticker" src="../assets/logo-sticker.svg" alt="sticker"/><div class="meta">Sticker · primary</div></div>
<div class="item"><img class="mono" src="../assets/logo-monogram.svg" alt="wordmark"/><div class="meta">Wordmark · narrow</div></div>
<div class="item"><div class="on-dark"><img class="sticker" src="../assets/logo-sticker.svg" style="width:90px;height:90px" alt=""/></div><div class="meta">On dark</div></div>
</body></html>
