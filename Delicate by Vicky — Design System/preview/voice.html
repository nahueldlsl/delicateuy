<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"/>
<title>Voice & copy</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 20px; background: var(--cream-50); font-family: var(--font-body); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg3); padding: 0 0 8px; }
  td { padding: 6px 8px 6px 0; vertical-align: top; }
  .yes { color: var(--success); font-weight: 700; padding-right: 6px; }
  .no { color: var(--danger); font-weight: 700; padding-right: 6px; }
  td.copy { color: var(--fg1); }
</style></head><body>
<table>
  <thead><tr><th>Surface</th><th>Yes</th><th>No</th></tr></thead>
  <tbody>
    <tr><td>Hero</td><td class="copy"><span class="yes">✓</span>Hechas hoy, para vos.</td><td class="copy"><span class="no">✗</span>Discover artisanal excellence</td></tr>
    <tr><td>CTA</td><td class="copy"><span class="yes">✓</span>Sumar al carrito</td><td class="copy"><span class="no">✗</span>ADD TO CART</td></tr>
    <tr><td>Cart vacío</td><td class="copy"><span class="yes">✓</span>Tu cajita está vacía 🤍</td><td class="copy"><span class="no">✗</span>Your cart is empty</td></tr>
    <tr><td>Sin stock</td><td class="copy"><span class="yes">✓</span>Por hoy, no quedan.</td><td class="copy"><span class="no">✗</span>Sold out</td></tr>
    <tr><td>Confirm</td><td class="copy"><span class="yes">✓</span>¡Listo, Viky ya recibió tu pedido!</td><td class="copy"><span class="no">✗</span>Order #4521 received</td></tr>
  </tbody>
</table>
</body></html>
