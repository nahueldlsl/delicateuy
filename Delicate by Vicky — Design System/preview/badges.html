<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"/>
<title>Badges & chips</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 24px; background: var(--cream-50); font-family: var(--font-body); display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .chip { padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; }
  .micro { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; }
  .lila { background: var(--lila-100); color: var(--lila-600); }
  .dulce { background: var(--cream-200); color: var(--dulce-700); }
  .rosa { background: var(--rosa-100); color: var(--rosa-500); }
  .success { background: #E9EFE3; color: var(--success); }
  .warn { background: #FBF1DE; color: #8A6A2E; }
  .danger { background: #FBE9E5; color: var(--danger); }
  .filled { background: var(--brand); color: #fff; }
  .stroke { background: transparent; color: var(--fg2); box-shadow: inset 0 0 0 1.5px var(--border-default); }
</style></head><body>
<span class="chip lila micro">Nuevo</span>
<span class="chip dulce micro">Retiro</span>
<span class="chip rosa micro">Edición San Valentín</span>
<span class="chip success micro">Listo</span>
<span class="chip warn micro">En preparación</span>
<span class="chip danger micro">Sin stock</span>
<span class="chip filled">Cookies (8)</span>
<span class="chip stroke">Alfajores</span>
<span class="chip stroke">Roles</span>
<span class="chip stroke">Tortas</span>
</body></html>
