<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"/>
<title>Buttons</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 24px; background: var(--cream-50); display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .btn { font-family: var(--font-body); font-weight: 700; font-size: 15px; border: none; cursor: pointer; padding: 12px 22px; border-radius: 999px; transition: background var(--dur-2) var(--ease-out), transform var(--dur-1) var(--ease-out); }
  .btn:active { transform: scale(0.97); }
  .primary { background: var(--brand); color: #fff; }
  .primary:hover { background: var(--brand-hover); }
  .accent { background: var(--accent); color: #fff; }
  .accent:hover { background: var(--accent-hover); }
  .ghost { background: transparent; color: var(--fg1); border: 1.5px solid var(--border-default); }
  .ghost:hover { background: var(--cream-100); }
  .icon { background: var(--lila-100); color: var(--lila-500); width: 44px; height: 44px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; font-size: 22px; padding: 0; }
  .icon:hover { background: var(--lila-200); }
  .small { padding: 8px 16px; font-size: 13px; }
</style></head><body>
<button class="btn primary">Sumar al carrito</button>
<button class="btn accent">Pedir ahora</button>
<button class="btn ghost">Ver más</button>
<button class="btn icon" aria-label="Add">+</button>
<button class="btn primary small">Confirmar</button>
</body></html>
