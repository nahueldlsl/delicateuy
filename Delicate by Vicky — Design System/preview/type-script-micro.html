<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"/>
<title>Type — Script & micro</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 24px; background: var(--cream-50); }
  .meta { font-family: var(--font-body); font-size: 11px; color: var(--fg3); letter-spacing: 0.06em; text-transform: uppercase; font-weight: 700; margin: 0 0 4px; }
  .script { font-family: var(--font-script); font-weight: 600; font-size: 36px; color: var(--lila-500); margin: 4px 0 16px; }
  .micro { font-family: var(--font-body); font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg3); }
  .pricetag { font-family: var(--font-display); font-weight: 600; font-size: 28px; color: var(--fg1); font-feature-settings: "tnum"; margin-top: 12px; }
  .row { display: flex; gap: 24px; align-items: baseline; }
</style></head><body>
<div class="meta">Script · Caveat 600 · used as decorative accent (1× per screen)</div>
<div class="script">del horno de hoy</div>
<div class="row">
  <div>
    <div class="meta">Micro label</div>
    <div class="micro">RETIRO · DELIVERY · NUEVO</div>
  </div>
  <div>
    <div class="meta">Price · tabular nums</div>
    <div class="pricetag">$3.500</div>
  </div>
</div>
</body></html>
