<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"/>
<title>Radii</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 20px; background: var(--cream-50); font-family: var(--font-body); }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .box { width: 70px; height: 70px; background: var(--lila-200); box-shadow: var(--shadow-sm); }
  .name { font-size: 11px; color: var(--fg2); font-weight: 700; }
  .hex { font-size: 10px; color: var(--fg3); font-family: ui-monospace, monospace; }
</style></head><body>
<div class="grid">
  <div class="item"><div class="box" style="border-radius:6px"></div><div class="name">xs</div><div class="hex">6px</div></div>
  <div class="item"><div class="box" style="border-radius:10px"></div><div class="name">sm</div><div class="hex">10px</div></div>
  <div class="item"><div class="box" style="border-radius:14px"></div><div class="name">md</div><div class="hex">14px</div></div>
  <div class="item"><div class="box" style="border-radius:20px"></div><div class="name">lg</div><div class="hex">20px</div></div>
  <div class="item"><div class="box" style="border-radius:28px"></div><div class="name">xl</div><div class="hex">28px</div></div>
  <div class="item"><div class="box" style="border-radius:999px"></div><div class="name">pill</div><div class="hex">999</div></div>
</div>
</body></html>
