<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"/>
<title>Spacing scale</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 20px; background: var(--cream-50); font-family: var(--font-body); }
  .item { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
  .bar { background: var(--lila-300); height: 14px; border-radius: 4px; }
  .lbl { font-size: 12px; color: var(--fg2); width: 60px; font-feature-settings: "tnum"; }
  .tok { font-size: 11px; color: var(--fg3); font-family: ui-monospace, monospace; }
</style></head><body>
<div class="item"><div class="lbl">4px</div><div class="bar" style="width:4px"></div><div class="tok">--s-1</div></div>
<div class="item"><div class="lbl">8px</div><div class="bar" style="width:8px"></div><div class="tok">--s-2</div></div>
<div class="item"><div class="lbl">12px</div><div class="bar" style="width:12px"></div><div class="tok">--s-3</div></div>
<div class="item"><div class="lbl">16px</div><div class="bar" style="width:16px"></div><div class="tok">--s-4</div></div>
<div class="item"><div class="lbl">24px</div><div class="bar" style="width:24px"></div><div class="tok">--s-6</div></div>
<div class="item"><div class="lbl">32px</div><div class="bar" style="width:32px"></div><div class="tok">--s-8</div></div>
<div class="item"><div class="lbl">48px</div><div class="bar" style="width:48px"></div><div class="tok">--s-12</div></div>
<div class="item"><div class="lbl">64px</div><div class="bar" style="width:64px"></div><div class="tok">--s-16</div></div>
</body></html>
