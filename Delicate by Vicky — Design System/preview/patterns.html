<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"/>
<title>Brand patterns</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 20px; background: var(--cream-50); font-family: var(--font-body); display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .item { display: flex; flex-direction: column; gap: 6px; }
  .meta { font-size: 11px; color: var(--fg3); letter-spacing: 0.06em; text-transform: uppercase; font-weight: 700; }
  .swatch { height: 110px; border-radius: 14px; box-shadow: var(--shadow-sm); }
  .vichy { background-image: url("../assets/pattern-vichy.svg"); background-size: 28px 28px; }
  .sprinkles { background-image: url("../assets/pattern-sprinkles.svg"); background-size: 160px 160px; background-color: var(--cream-100); }
</style></head><body>
<div class="item"><div class="meta">Vichy · packaging tissue</div><div class="swatch vichy"></div></div>
<div class="item"><div class="meta">Sprinkles · decorative</div><div class="swatch sprinkles"></div></div>
</body></html>
