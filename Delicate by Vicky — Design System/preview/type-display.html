<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"/>
<title>Type — Display</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 24px; background: var(--cream-50); }
  .specimen { color: var(--fg1); }
  .meta { font-family: var(--font-body); font-size: 11px; color: var(--fg3); letter-spacing: 0.06em; text-transform: uppercase; font-weight: 700; margin-bottom: 6px; }
  .display { font-family: var(--font-display); font-weight: 500; font-size: 56px; line-height: 1.05; letter-spacing: -0.02em; font-variation-settings: "opsz" 144; margin-bottom: 14px; }
  .h1 { font-family: var(--font-display); font-weight: 500; font-size: 38px; line-height: 1.1; letter-spacing: -0.015em; }
</style></head><body>
<div class="meta">Display · Fraunces 500 · 56px · -2% tracking</div>
<div class="display specimen">Hechas hoy, para vos.</div>
<div class="meta">H1 · Fraunces 500 · 38px</div>
<div class="h1 specimen">Cookies estilo NY</div>
</body></html>
