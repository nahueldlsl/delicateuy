<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"/>
<title>Semantic colors</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 20px; background: var(--cream-50); font-family: var(--font-body); }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 12px; }
  .item { background: #fff; border-radius: var(--r-md); padding: 12px; box-shadow: var(--shadow-xs); }
  .chip { width: 100%; height: 36px; border-radius: var(--r-sm); margin-bottom: 8px; }
  .name { font-size: 12px; font-weight: 700; color: var(--fg1); }
  .token { font-size: 11px; color: var(--fg3); font-family: ui-monospace, monospace; }
  h4 { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg3); margin: 0 0 8px; font-weight: 700; }
</style></head><body>
<h4>Semantic roles</h4>
<div class="row">
  <div class="item"><div class="chip" style="background:var(--bg);border:1px solid var(--border-subtle)"></div><div class="name">Page bg</div><div class="token">--bg</div></div>
  <div class="item"><div class="chip" style="background:var(--brand)"></div><div class="name">Brand</div><div class="token">--brand</div></div>
  <div class="item"><div class="chip" style="background:var(--accent)"></div><div class="name">Accent (CTA)</div><div class="token">--accent</div></div>
  <div class="item"><div class="chip" style="background:var(--fg1)"></div><div class="name">Text 1</div><div class="token">--fg1</div></div>
</div>
<div class="row">
  <div class="item"><div class="chip" style="background:var(--success)"></div><div class="name">Success</div><div class="token">--success</div></div>
  <div class="item"><div class="chip" style="background:var(--warning)"></div><div class="name">Warning</div><div class="token">--warning</div></div>
  <div class="item"><div class="chip" style="background:var(--danger)"></div><div class="name">Danger</div><div class="token">--danger</div></div>
  <div class="item"><div class="chip" style="background:var(--rosa-300)"></div><div class="name">Rosa (heart)</div><div class="token">--rosa-300</div></div>
</div>
</body></html>
