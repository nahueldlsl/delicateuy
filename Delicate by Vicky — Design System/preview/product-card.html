<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"/>
<title>Product card</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 24px; background: var(--cream-50); display: flex; gap: 18px; }
  .card { width: 240px; background: #fff; border-radius: 20px; box-shadow: var(--shadow-sm); overflow: hidden; transition: box-shadow var(--dur-2) var(--ease-out), transform var(--dur-2) var(--ease-out); font-family: var(--font-body); }
  .card:hover { box-shadow: var(--shadow-lg); transform: translateY(-2px); }
  .photo { aspect-ratio: 1; overflow: hidden; }
  .photo img { width: 100%; height: 100%; object-fit: cover; transition: transform var(--dur-3) var(--ease-out); }
  .card:hover .photo img { transform: scale(1.04); }
  .body { padding: 14px 16px 16px; }
  .name { font-size: 16px; font-weight: 700; color: var(--fg1); margin: 0 0 2px; }
  .tag { font-family: var(--font-script); font-size: 18px; color: var(--lila-500); line-height: 1; margin-bottom: 10px; }
  .row { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
  .price { font-family: var(--font-display); font-weight: 600; font-size: 20px; color: var(--fg1); font-feature-settings: "tnum"; }
  .add { background: var(--brand); color: #fff; border: none; border-radius: 999px; width: 36px; height: 36px; font-size: 22px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
  .add:hover { background: var(--brand-hover); }
</style></head><body>
<div class="card">
  <div class="photo"><img src="../assets/products/cookie-ny-dulce-leche.jpg" alt=""/></div>
  <div class="body">
    <div class="tag">del horno de hoy</div>
    <h3 class="name">Cookie NY · dulce de leche</h3>
    <div class="row"><div class="price">$3.500</div><button class="add">+</button></div>
  </div>
</div>
<div class="card">
  <div class="photo"><img src="../assets/products/roles-oreo-dulce-leche.jpg" alt=""/></div>
  <div class="body">
    <div class="tag">recién glaseados</div>
    <h3 class="name">Roles · oreo & ddl</h3>
    <div class="row"><div class="price">$5.200</div><button class="add">+</button></div>
  </div>
</div>
</body></html>
