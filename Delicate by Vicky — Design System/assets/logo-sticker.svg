<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="delicate by Viky sticker logo">
  <defs>
    <radialGradient id="stickerGrad" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#C9A8E6"></stop>
      <stop offset="100%" stop-color="#A988CC"></stop>
    </radialGradient>
    <filter id="stickerShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"></feGaussianBlur>
      <feOffset dx="0" dy="3" result="offsetblur"></feOffset>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"></feFuncA></feComponentTransfer>
      <feMerge><feMergeNode></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
    </filter>
  </defs>

  
  <circle cx="200" cy="200" r="190" fill="url(#stickerGrad)" filter="url(#stickerShadow)"></circle>
  <circle cx="200" cy="200" r="190" fill="none" stroke="#9776BD" stroke-width="2" opacity="0.4"></circle>

  
  <g stroke-linecap="round" stroke-width="6">
